services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Enable sparse vectors (BM25) alongside dense
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT_DIR=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      retries: 3

volumes:
  qdrant_data:
